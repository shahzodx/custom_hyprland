# macOS-inspired layout over the current desktop wallpaper.
general {
    hide_cursor = true
    ignore_empty_input = true
}

animations {
    enabled = true
    bezier = lockEase, 0.16, 1, 0.3, 1
    animation = fade, 1, 0.45, lockEase
    animation = inputFieldColors, 1, 0.25, lockEase
    animation = inputFieldFade, 1, 0.2, lockEase
    animation = inputFieldDots, 1, 0.2, lockEase
}

background {
    monitor =
    path = @HOME@/.cache/current-wallpaper
    color = rgb(23, 24, 25)
    blur_passes = 0
    brightness = 1.0
    contrast = 1.0
}

# Small status row at the upper right.
image {
    monitor =
    path = @HOME@/.config/hypr/assets/lock-wifi.png
    size = 22
    position = -213, 24
    halign = right
    valign = top
}

image {
    monitor =
    path = @HOME@/.config/hypr/assets/lock-battery.png
    size = 20
    position = -174, 24
    halign = right
    valign = top
}

label {
    monitor =
    text = cmd[update:30000] LC_TIME=C date "+%a, %b %-d  %-I:%M %p"
    color = rgba(255, 255, 255, 0.94)
    font_size = 12
    font_family = Inter
    shadow_passes = 2
    shadow_color = rgba(0, 0, 0, 0.45)
    position = -22, 22
    halign = right
    valign = top
}

# Full date and large 12-hour clock at the top center.
label {
    monitor =
    text = cmd[update:60000] LC_TIME=C date "+%A, %B %-d"
    color = rgba(255, 255, 255, 0.98)
    font_size = 20
    font_family = Inter
    shadow_passes = 3
    shadow_color = rgba(0, 0, 0, 0.62)
    position = 0, 400
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:30000] date "+%-I:%M"
    color = rgb(255, 255, 255)
    font_size = 124
    font_family = Inter SemiBold
    shadow_passes = 3
    shadow_color = rgba(0, 0, 0, 0.42)
    shadow_boost = 1.1
    position = 0, 265
    halign = center
    valign = center
}

# Account group near the bottom center.
label {
    monitor =
    text = $USER
    color = rgb(255, 255, 255)
    font_size = 17
    font_family = Inter
    shadow_passes = 2
    shadow_color = rgba(0, 0, 0, 0.55)
    position = 0, -378
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 340, 48
    outline_thickness = 1
    outer_color = rgba(255, 255, 255, 0.32)
    inner_color = rgba(225, 232, 255, 0.16)
    font_color = rgba(255, 255, 255, 0.98)
    font_family = Inter
    placeholder_text = Enter Password
    check_color = rgb(220, 230, 220)
    fail_color = rgb(255, 255, 255)
    fade_on_empty = true
    dots_size = 0.22
    dots_spacing = 0.22
    dots_center = true
    rounding = 24
    shadow_passes = 3
    shadow_color = rgba(4, 8, 35, 0.32)
    position = 0, -438
    halign = center
    valign = center
}

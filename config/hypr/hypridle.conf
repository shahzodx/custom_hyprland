# Lock only when the system is about to sleep (for example, when closing the lid).
# The usage-statistics idle timer below does not lock or suspend the laptop.
general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
    inhibit_sleep = 3
}

# Pause application statistics after three minutes without input.
listener {
    timeout = 180
    on-timeout = python3 @HOME@/.config/waybar/scripts/app-usage.py idle
    on-resume = python3 @HOME@/.config/waybar/scripts/app-usage.py resume
}

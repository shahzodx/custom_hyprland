font_family      JetBrains Mono
bold_font        JetBrains Mono Bold
italic_font      JetBrains Mono Italic
bold_italic_font JetBrains Mono Bold Italic
font_size        12.0
disable_ligatures never
modify_font cell_height 110%

window_padding_width 14 16
hide_window_decorations yes
confirm_os_window_close 0
background_opacity 0.94
dynamic_background_opacity yes
remember_window_size no
initial_window_width  110c
initial_window_height 32c

cursor_shape beam
cursor_beam_thickness 1.6
cursor_blink_interval 0.6
cursor_stop_blinking_after 10
cursor_trail 1
cursor_trail_decay 0.08 0.25

scrollback_lines 10000
mouse_hide_wait 2.0
copy_on_select yes
strip_trailing_spaces smart
url_style curly
detect_urls yes
enable_audio_bell no
visual_bell_duration 0

enabled_layouts splits, stack
window_border_width 1pt
window_margin_width 2
inactive_text_alpha 0.7
active_border_color   #6e6e6e
inactive_border_color #2a2a2a
bell_border_color     #a8a8a8

tab_bar_edge bottom
tab_bar_style powerline
tab_powerline_style round
tab_bar_min_tabs 2
tab_title_template "{index} {title[:24]}"
active_tab_foreground   #141414
active_tab_background   #e6e6e6
active_tab_font_style   bold
inactive_tab_foreground #6e6e6e
inactive_tab_background #1c1c1c
inactive_tab_font_style normal
tab_bar_background      #121212

foreground            #d0d0d0
background            #121212
selection_foreground  #141414
selection_background  #bdbdbd
cursor                #e6e6e6
cursor_text_color     #121212
url_color             #a8a8a8

color0  #1c1c1c
color8  #4a4a4a
color1  #b07a7a
color9  #c49494
color2  #8fa58a
color10 #a7bba2
color3  #c2ab83
color11 #d3c19f
color4  #7f95ad
color12 #9cb0c4
color5  #a08aab
color13 #b7a5c0
color6  #82a3a3
color14 #9fbaba
color7  #a8a8a8
color15 #e6e6e6

map ctrl+shift+enter launch --location=split --cwd=current
map ctrl+shift+\     launch --location=vsplit --cwd=current
map ctrl+shift+minus launch --location=hsplit --cwd=current
map ctrl+shift+t     new_tab_with_cwd
map ctrl+shift+w     close_window
map ctrl+shift+z     toggle_layout stack

map ctrl+shift+h neighboring_window left
map ctrl+shift+l neighboring_window right
map ctrl+shift+k neighboring_window up
map ctrl+shift+j neighboring_window down

map ctrl+shift+left  resize_window narrower 3
map ctrl+shift+right resize_window wider 3
map ctrl+shift+up    resize_window taller 2
map ctrl+shift+down  resize_window shorter 2

map ctrl+1 goto_tab 1
map ctrl+2 goto_tab 2
map ctrl+3 goto_tab 3
map ctrl+4 goto_tab 4
map ctrl+5 goto_tab 5

map ctrl+equal change_font_size all +1.0
map ctrl+minus change_font_size all -1.0
map ctrl+0     change_font_size all 0

map ctrl+shift+a>m set_background_opacity +0.05
map ctrl+shift+a>l set_background_opacity -0.05

map ctrl+shift+f5 load_config_file

# Keep typography and terminal ANSI colors; match wallpaper surfaces and accents.
include wallpaper-colors.conf
